# district.yaml — 單一配置驅動整區部署
district: sai-kung
domain: we1co.me
# 對應 LCSD fid / swpId / HKPL / EPD 資源
pools:
  - {id: tkoswim, swpId: 35, district: "Sai Kung"}
  - {id: ktswim,  swpId: 18, district: "Kwun Tong"}  # 西貢頁同時顯示觀塘泳池作對照
playrooms: # fcid/did 來自 LCSD clpss
  - {id: playroom-tko1, fcid: "...", did: 8}
  - {id: playroom-tko2, fcid: "...", did: 8}
  - {id: playroom-tko3, fcid: "...", did: 8}
libraries:
  - {id: tkolib, hkpl: "tseung-kwan-o"}
  - {id: tklib,  hkpl: "tiu-keng-leng"}
sport_grounds:
  - {id: tkosport, fid: 1060} # 將軍澳運動場，XLSX timetabling (A/L/B/M)
rvm:
  filter: {area: "NEW_TERRITORIES", district: "SAI KUNG"}
  names: [彩明商場, 新都城中心三期, PopCorn, 寶林商場, The_LOHAS, TKO_Spot, 怡明邨, 海悅豪園商場]
cron: "15,20,25 7 * * *" # 每日一次，07:15/20/25 錯峰
cf_proxy: lcsd-proxy.forumdata.workers.dev # Anycast 隱藏 VM 固定 IP
