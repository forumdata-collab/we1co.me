<script>
// 天氣模組 — HKO 官方 Open Data API (CORS enabled)
(function(){
  const API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
  const ICON_BASE='https://d28gfsrd1pujc.cloudfront.net/frontend_images/mod_sp_weather/images/';
  async function fetchWeather(){
    try{
      const r=await fetch(API);
      const d=await r.json();
      const temps=(d.temperature?.data)||[];
      const hums=(d.humidity?.data)||[];
      // 優先顯示香港天文台讀數，否則第一個
      const t=(temps.find(x=>x.place==='香港天文台')||temps[0]||{}).value;
      const h=(hums.find(x=>x.place==='香港天文台')||hums[0]||{}).value;
      const icon=(d.icon&&d.icon[0])||'50';
      const el=document.getElementById('topWeather');
      if(el){
        el.innerHTML=
          `<img src="${ICON_BASE}weather_${icon}.png" alt="" style="height:16px;vertical-align:middle;margin-right:4px">`+
          `<span style="font-weight:700">${t??'--'}°C</span>`+
          `<span style="opacity:.8;margin-left:6px">💧${h??'--'}%</span>`;
      }
    }catch(e){
      const el=document.getElementById('topWeather');
      if(el) el.textContent='天氣資料暫不可用';
    }
  }
  fetchWeather();
  setInterval(fetchWeather,600000); // 10分鐘更新（HKO rhrread 每10分鐘更新）
})();
</script>

function hkNow(){return new Date()} // server already HKT, no +8h
function hkMinutes(d){return d.getHours()*60+d.getMinutes()}
function parseRange(s){
// s like "早上 9:00 - 9:45" or "下午 12:30 - 13:15" or "24小時" or "06:30 - 12:00"
if(s.includes("24小時")) return {start:0,end:1440}
let m=s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
if(!m) return null;
let sh=parseInt(m[1]), sm=parseInt(m[2]), eh=parseInt(m[3]), em=parseInt(m[4]);
let isPM=s.includes("下午")||s.includes("晚上")||s.includes("傍晚")||s.includes("晚");
let isNoon=s.includes("中午");
if(isPM){
 if(sh!==12&&sh<12) sh+=12;
 if(eh!==12&&eh<12) eh+=12;
}else if(isNoon){
 if(sh===12) sh=12;
 if(eh<12) eh+=12;
}
let start=sh*60+sm, end=eh*60+em;
if(end<=start) end=1440; // 跨午夜：00:00 視為當日結束
return {start:start,end:end}
}
function sessionStatus(range, nowM){
if(!range) return {text:"—",cls:"done"};
if(nowM < range.start) return {text:t('soon'),cls:"soon"};
if(nowM >= range.start && nowM < range.end) return {text:t('open'),cls:"open"};
return {text:t('done'),cls:"done"};
}
function facilityOverallStatus(sessions, nowM){
let hasOpen=false, hasSoon=false;
for(let s of sessions){
 let r=parseRange(s);
 let st=sessionStatus(r, nowM);
 if(st.cls==="open") hasOpen=true;
 if(st.cls==="soon") hasSoon=true;
}
if(hasOpen) return {text:t('open'),cls:"status-open"};
if(hasSoon) return {text:t('soon'),cls:"status-upcoming"};
return {text:t('closed'),cls:"status-closed"};
}

// 判斷某池今日是否因每年維修而暫停（11/1-4/15 跨年）
function inMaintenance(m, now){
  const y=now.getFullYear();
  const [sm,sd]=m.start.split('/').map(Number);
  const [em,ed]=m.end.split('/').map(Number);
  const d=now.getDate(), mo=now.getMonth()+1;
  if(m.nextYear){
    // 跨年：11/1 至 4/15
    if(mo>sm || (mo===sm&&d>=sd) || mo<em || (mo===em&&d<=ed)) return true;
  }else{
    if(mo>sm||(mo===sm&&d>=sd)) { if(mo<em||(mo===em&&d<=ed)) return true; }
    else if(mo===em&&d<=ed) return true;
  }
  return false;
}
// 今日是否清潔日
function isCleaningDay(cleaning, now){
  if(!cleaning||!cleaning.day) return false;
  const CN=['日','一','二','三','四','五','六'];
  return CN[now.getDay()]===cleaning.day;
}

// 從閉館公告 + 每年維修 + 清潔日 自動推導子設施狀態
function poolSubStatuses(f, todayStr, now){
  let closedSet=new Set();
  const nm=hkMinutes(now);
  if(f.closures){
    f.closures.filter(c=>c.date===todayStr).forEach(c=>{
      // 公告有時間範圍（如 06:30-14:15），只喺範圍內先算暫停
      const r=parseRange(c.time);
      if(r && nm>=r.start && nm<r.end){
        c.pools.split(/[,，]/).map(s=>s.trim()).forEach(p=>closedSet.add(p));
      }
    });
  }
  // 每年維修
  if(f.maintenance){
    const alias=f.id==='ktswim'?{'戶外泳池':['副池','日光浴場'],'室內泳池':['主池','訓練池','習泳池 1&2']}:{};
    f.maintenance.forEach(m=>{
      if(inMaintenance(m,now)){
        const targets=alias[m.pool]||[m.pool];
        targets.forEach(p=>closedSet.add(p));
      }
    });
  }
  return f.facilities.map(x=>{
    if(closedSet.has(x.name)){
      return {...x, status:'closed', note:t('closedNote')};
    }
    return x;
  });
}

// Reusable official-link button (replaces 3× duplicated template)
function officialLink(url,labelKey){return url?`<a href="${url}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:12px;padding:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:.78rem;color:#1e3a8a;text-decoration:none">${t(labelKey)}</a>`:'';}

 const todayStr=now.toISOString().slice(0,10).replace(/-/g,'/');

   let st = facilityOverallStatus(f.schedule.summer.map(x=>x.time), nm);
   // 今天及未來的暫停開放公告
   let closureHtml='';
   if(f.closures){
     closureHtml=f.closures.filter(c=>{if(c.date>todayStr)return true;if(c.date!==todayStr)return false;const cr=parseRange(c.time);return cr&&nm<cr.end}).map(c=>{
     const p=currentLang==='en'?(c.poolsEn||c.pools):c.pools;
     const r=currentLang==='en'?(c.reasonEn||c.reason):c.reason;
     return `<div class="notice" style="background:#fee2e2;border-color:#fecaca;color:#991b1b">⚠️ ${t('closure')}（${c.date} ${c.time}）：${p} — ${t('closureReason')} ${r}</div>`
     }).join('');
   }
   // 今日清潔日提示
   if(f.cleaning&&isCleaningDay(f.cleaning, now)){
     closureHtml+=`<div class="notice" style="background:#e0e7ff;border-color:#c7d2fe;color:#3730a3">🧹 ${t('cleaningDay')}（${f.cleaning.day}${f.cleaning.fallback?' → '+f.cleaning.fallback:''}）</div>`;
   }
   let sessions=f.schedule.summer.map(s=>{
     let r=parseRange(s.time);
     let ss=sessionStatus(r,nm);
     return `<div class="session"><span class="session-time">${trSession(s.session,currentLang)} ${trSession(s.time,currentLang)}</span><span class="session-status ${ss.cls}">${ss.text}</span></div>`
   }).join("");
   let subPools=poolSubStatuses(f, todayStr, now);
   // Dynamic partial status: some facilities closed → partially open
   const subClosed=subPools.filter(x=>x.status==='closed').length;
   if(subClosed>0 && subClosed<subPools.length) st={text:t('partial'),cls:"status-partial"};
   else if(subClosed===subPools.length) st={text:t('closed_today'),cls:"status-suspended"};
   let pools=subPools.map(x=>{
     let fs=FSTATUS[x.status]||FSTATUS.closed;
     return `<div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:2px"><div style="display:flex;justify-content:space-between;width:100%;align-items:center"><span class="detail-label">${tl('pool',x.name)} <small style="color:#94a3b8">${x.spec}</small></span><span class="session-status ${fs.c}">${fs.t}</span></div>${x.note?`<small style="color:#92400e;font-size:.75rem;text-align:right;width:100%">${tl('note',x.note)}</small>`:''}</div>`
   }).join("");
   let official=officialLink(f.officialUrl,'view');
   return `<div class="card collapsed" id="${f.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(f.id)}</div><div class="facility-address">${addr(f)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint"></span></div></div><div class="facility-body">${pools}<div class="schedule-section"><div class="schedule-title">${t('hours')}</div>${sessions}</div>${closureHtml}${official}</div></div>`
 }).join("");
}
function renderPlayrooms(){
 const now=hkNow(), nm=hkMinutes(now);
 return PLAYROOMS.map(p=>{
   let st=facilityOverallStatus(p.sessions, nm);
   let html=p.sessions.map(s=>{
     let r=parseRange(s);
     let ss=sessionStatus(r,nm);
     return `<div class="session"><span class="session-time">${trSession(s,currentLang)}</span><span class="session-status ${ss.cls}">${ss.text}</span></div>`
   }).join("");
   let official=officialLink(p.officialUrl,'view');
   return `<div class="card collapsed" id="${p.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(p.id)}</div><div class="facility-address">${addr(p)} · ${tl('pool',p.theme)} · ${p.area}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${st.cls}">${st.text}</span><span class="expand-hint"></span></div></div><div class="facility-body"><div class="schedule-section"><div class="schedule-title">${t('hours45')}</div>${html}</div><div class="notice">${tl('note',p.note)}</div>${official}</div></div>`
 }).join("");
}
function renderLibraries(){
 const now=hkNow(); let day=now.getDay();
 let today=LDAY[currentLang][day];
 return LIBRARIES.map(l=>{
   let todayRow=l.weekly.find(w=>w.day===LDAY.zh[day]);
   let nm=hkMinutes(now);
   let r=todayRow?parseRange(todayRow.time):null;
   let st=r?sessionStatus(r,nm):{text:t('closed'),cls:"status-closed"};
   let badgeCls = st.cls==="open"?"status-open":st.cls==="soon"?"status-upcoming":"status-closed";
   let badgeText = st.text===t('open')?t('open'):st.text;
   let rows=l.weekly.map(w=>{
     let isToday=w.day===LDAY.zh[day];
     return `<div class="session" style="${isToday?'background:#f0fdf4;border-radius:6px;padding:6px 8px':''}"><span class="session-time">${trDay(w.day,currentLang)} ${w.time}${isToday?' ← '+t('today'):''}</span><span class="session-status ${isToday?st.cls:'done'}">${isToday?badgeText:''}</span></div>`
   }).join("");
   let official=officialLink(l.officialUrl,'viewLib');
   return `<div class="card collapsed" id="${l.id}"><div class="facility-header" onclick="toggleCard(this)"><div><div class="facility-name">${lname(l.id)}</div><div class="facility-address">${addr(l)}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span class="status-badge ${badgeCls}">${badgeText}</span><span class="expand-hint"></span></div></div><div class="facility-body"><div class="schedule-section"><div class="schedule-title">${t('libhours')}</div>${rows}</div>${official}</div></div>`
 }).join("");
}
function renderRVM(){
 const now=hkNow(), nm=hkMinutes(now);
 const items=RVM_FACILITIES.map(r=>{
   let rng=parseRange(r.hours);
   let st=sessionStatus(rng,nm);
   let cls=st.cls==="open"?"rvm-status-operating":st.cls==="soon"?"rvm-status-operating":"rvm-status-maintenance";
   let txt=st.cls==="open"?t('rvm_open'):st.cls==="soon"?t('rvm_soon'):t('rvm_closed');
   if(r.hours==="24小時"){cls="rvm-status-operating";txt=t('rvm_open')}
   return `<div class="rvm-item"><div class="rvm-info"><div class="rvm-name">${tl('rvm',r.name)}</div><div class="rvm-address">${addrRVM(r)}</div><div class="rvm-hours">${r.hours}</div></div><span class="rvm-status ${cls}">${txt}</span></div>`
 }).join("");
 return `<div class="rvm-card"><div class="rvm-grid">${items}</div><div class="rvm-sync">${t('sync')}：${now.toLocaleString('zh-HK',{hour12:false}).replace(/\//g,'-')}</div><div style="text-align:center;margin-top:8px"><a href="https://www.hkrvms3.com.hk/hk/" target="_blank" rel="noopener" style="font-size:.75rem;color:#1e3a8a;text-decoration:underline">hkrvms3.com.hk — 入樽機官方地圖 ↗</a></div></div>`;
}
function renderAll(){
 document.getElementById('facilities').innerHTML=renderPools();
 document.getElementById('playrooms').innerHTML=renderPlayrooms();
 document.getElementById('libraries').innerHTML=renderLibraries();
 document.getElementById('rvm-facilities').innerHTML=renderRVM();
 updateClock();
}
function updateClock(){
 const now=hkNow();
 const fmt={timeZone:'Asia/Hong_Kong',hour12:false};
 document.getElementById('topDate').textContent=new Date().toLocaleDateString('zh-HK',{...fmt,month:'2-digit',day:'2-digit',weekday:'short'}).replace(/\//g,'-')+' '+new Date().toLocaleTimeString('zh-HK',{...fmt,hour:'2-digit',minute:'2-digit'});
}
function toggleSection(id){
 document.getElementById(id).classList.toggle('collapsed');
}
// nav title already in bar, no extra header needed
setInterval(()=>{renderAll()},60000);
renderAll();
// 最後更新：靜態 timestamp（頁面載入時設定一次，唔隨系統跳動）
const fmt={timeZone:'Asia/Hong_Kong',hour12:false};
const LAST_UPDATE=new Date().toLocaleString('zh-HK',{...fmt,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).replace(/\//g,'-');
document.getElementById('lastUpdate').textContent=LAST_UPDATE;
setInterval(updateClock,1000);
updateClock();
document.getElementById('backToTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>{document.getElementById('backToTop').classList.toggle('visible',window.scrollY>300)});
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',e=>{
 e.preventDefault();
 currentLang=b.dataset.lang;
 document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x===b));
 document.documentElement.lang=currentLang==='zh'?'zh-HK':currentLang==='cn'?'zh-CN':'en';
 // 更新標題、導航、區塊標題、頁尾
 document.querySelector('.nav-title').textContent=t('title');
 document.title=t('title')+' | we1co.me';
 const secMap={swim:t('pools'),playroom:t('playrooms'),library:t('library'),rvm:t('rvm')};
 document.querySelectorAll('section.collapsible h2').forEach(h=>{
   const id=h.closest('section').id;
   h.innerHTML=secMap[id]+' <span class="toggle"></span>';
 });
 // 快速導覽
 const navItems=document.querySelectorAll('.index-item');
 const navTxt=[t('pools')+' (2)',t('playrooms')+' (3)',t('library')+' (2)',t('rvm')+' (8)'];
 navItems.forEach((el,i)=>{ if(navTxt[i]) el.textContent=navTxt[i]; });
 // 頁尾
 document.querySelector('.updated').innerHTML=t('lastUpd')+'：<span id="lastUpdate">'+LAST_UPDATE+'</span> · '+t('src');
 // 收合提示文字
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('collapsed',c.classList.contains('collapsed')));
 renderAll();
}));
</script>
</body>
